pre-commit:
  parallel: true
  commands:
    format:
      glob:
        - 'packages/**/*.{js,mjs,ts,mts,html,css,json}'
        - 'apps/**/*.{js,mjs,ts,mts,html,css,json}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
